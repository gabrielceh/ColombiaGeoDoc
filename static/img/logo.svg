<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="500" height="500">
  <defs>
    <!-- Degradado Tricolor de la Bandera de Colombia (Amarillo 50%, Azul 25%, Rojo 25%) -->
    <linearGradient id="colombiaFlag" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FCD116" />
      <stop offset="50%" stop-color="#FCD116" />
      <stop offset="50%" stop-color="#003893" />
      <stop offset="75%" stop-color="#003893" />
      <stop offset="75%" stop-color="#CE1126" />
      <stop offset="100%" stop-color="#CE1126" />
    </linearGradient>
  </defs>

  <style>
    .brace {
      fill: none;
      stroke: url(#colombiaFlag);
      stroke-width: 36;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    .api-text {
      font-family: 'Montserrat', 'Arial', 'Helvetica', sans-serif;
      font-weight: 700;
      font-size: 110px;
      fill: #FCD116;
      text-anchor: middle;
      dominant-baseline: central;
    }
  </style>

  <!-- Llave Izquierda '{' -->
  <path class="brace" d="
    M 145 65
    C 110 65 100 80 100 115
    L 100 198
    C 100 228 75 242 35 250
    C 75 258 100 272 100 302
    L 100 385
    C 100 420 110 435 145 435
  "/>

  <!-- Llave Derecha '}' -->
  <path class="brace" d="
    M 355 65
    C 390 65 400 80 400 115
    L 400 198
    C 400 228 425 242 465 250
    C 425 258 400 272 400 302
    L 400 385
    C 400 420 390 435 355 435
  "/>

  <!-- Texto API Centrado -->
  <text x="250" y="252" class="api-text">API</text>
</svg>
